name: Specsfy

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Checkout brand
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: specsfy/brand
          path: brand
      - name: Checkout documentation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: specsfy/docs
          path: docs
      - name: Checkout skills source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: specsfy/skills
          path: skills
      - name: Checkout public overview
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: specsfy/specsfy
          path: specsfy
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12.11'
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: false
      - name: Prepare test environment
        run: |
          uv venv --python 3.12.11
          uv pip install behave==1.3.3
      - name: Verify dev workspace
        run: |
          uv run --offline python3 -B -m unittest discover \
            -s tests -p 'test_*.py'
          uv run --offline behave tests/features --no-capture
