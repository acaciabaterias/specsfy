[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "specsfy-cli"
version = "0.6.0"
description = "CLI e TUI para instalar e acompanhar o Specsfy"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["textual>=8.2.8,<9"]

[project.urls]
Homepage = "https://github.com/promovaweb/specsfy"
Repository = "https://github.com/promovaweb/specsfy.git"
Documentation = "https://github.com/promovaweb/specsfy/tree/main/docs"
Issues = "https://github.com/promovaweb/specsfy/issues"

[project.scripts]
specsfy = "specsfy_cli.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/specsfy_cli"]

[tool.hatch.build.targets.sdist]
include = ["src/specsfy_cli", "tests", "README.md", "LICENSE"]
