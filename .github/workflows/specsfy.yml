name: Specsfy

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Checkout brand
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: specsfy/brand
          path: brand
      - name: Checkout documentation
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: specsfy/docs
          path: docs
      - name: Checkout skills source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: specsfy/skills
          path: skills
      - name: Checkout public overview
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: specsfy/specsfy
          path: specsfy
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.11'
      - uses: astral-sh/setup-uv@e92bafb6253dcd438e0484186d7669ea7a8ca1cc # v6.4.3
      - name: Prepare test environment
        run: |
          uv venv --python 3.12.11
          uv pip install behave==1.3.3
      - name: Verify dev workspace
        run: |
          uv run --offline python3 -B -m unittest discover \
            -s tests -p 'test_*.py'
          uv run --offline behave tests/features --no-capture
