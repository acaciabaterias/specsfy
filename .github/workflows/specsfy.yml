name: Specsfy

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  integrated:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12.11'
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: false
      - run: python3 -B -m unittest discover -s tests -p 'test_*.py'
      - run: uv run --quiet --with behave==1.3.3 behave tests/features --no-capture

  skills:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        module: [skills, specialists]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: false
      - run: python3 -B -m unittest discover -s tests -p 'test_*.py'
      - run: uv run --quiet --with behave==1.3.3 behave tests/features --no-capture

  cli:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: false
      - run: uv sync --locked
      - run: uv run python -B -m unittest discover -s tests -p 'test_*.py'
      - run: uv build
      - run: uv run specsfy --help
      - name: Validar instalação local e atualização
        env:
          UV_TOOL_DIR: ${{ runner.temp }}/specsfy-tools
          UV_TOOL_BIN_DIR: ${{ runner.temp }}/specsfy-bin
        run: |
          uv tool install --force .
          uv tool upgrade specsfy-cli
          "${UV_TOOL_BIN_DIR}/specsfy" --version
      - name: Validar versão da tag
        if: github.ref_type == 'tag'
        run: |
          version="$(uv run python -B -c 'from specsfy_cli import __version__; print(__version__)')"
          test "v${version}" = "${GITHUB_REF_NAME}"

  example:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: example
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12.11'
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: false
      - run: composer setup
      - run: composer ci:check
      - run: python3 -B -m unittest discover -s tests -p 'test_documentation.py'
      - run: uv run --quiet --with behave==1.3.3 behave tests/features --no-capture
