<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
  xmlns="http://www.w3.org/2000/svg"
  xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
  width="512"
  height="512"
  viewBox="0 0 512 512"
  role="img"
  aria-labelledby="title description">
  <title id="title">Ícone do framework Specsfy</title>
  <desc id="description">Ícone vetorial do framework Specsfy, com três placas empilhadas e um símbolo de código na placa superior.</desc>

  <!--
    Cada grupo abaixo é reconhecido como uma camada pelo Inkscape.
    As cores podem ser alteradas individualmente pelo atributo "stroke" ou "fill".
  -->

  <g
    inkscape:groupmode="layer"
    inkscape:label="01 — Placa inferior"
    id="layer-bottom">
    <path
      id="bottom-plate"
      d="M 34,334 L 256,478 L 478,334"
      fill="none"
      stroke="#000000"
      stroke-width="36"
      stroke-linecap="round"
      stroke-linejoin="round"/>
  </g>

  <g
    inkscape:groupmode="layer"
    inkscape:label="02 — Placa intermediária"
    id="layer-middle">
    <path
      id="middle-plate"
      d="M 34,254 L 256,398 L 478,254"
      fill="none"
      stroke="#000000"
      stroke-width="36"
      stroke-linecap="round"
      stroke-linejoin="round"/>
  </g>

  <g
    inkscape:groupmode="layer"
    inkscape:label="03 — Placa superior"
    id="layer-top">
    <path
      id="top-plate"
      d="M 245.73,18.11
         C 251.96,14.10 260.04,14.10 266.27,18.11
         L 489.19,161.63
         C 493.45,164.37 496,169.08 496,174.15
         C 496,179.21 493.45,183.92 489.19,186.66
         L 266.27,334.01
         C 260.04,338.03 251.96,338.03 245.73,334.01
         L 22.81,186.66
         C 18.55,183.92 16,179.21 16,174.15
         C 16,169.08 18.55,164.37 22.81,161.63
         Z"
      fill="#000000"/>
  </g>

  <g
    inkscape:groupmode="layer"
    inkscape:label="04 — Código: chevron esquerdo"
    id="layer-code-left">
    <path
      id="code-left"
      d="M 190.5,143.5 L 160,176 L 190.5,208.5"
      fill="none"
      stroke="#FFFFFF"
      stroke-width="32"
      stroke-linecap="round"
      stroke-linejoin="round"/>
  </g>

  <g
    inkscape:groupmode="layer"
    inkscape:label="05 — Código: barra central"
    id="layer-code-slash">
    <path
      id="code-slash"
      d="M 269,124 L 243,228"
      fill="none"
      stroke="#FFFFFF"
      stroke-width="32"
      stroke-linecap="round"/>
  </g>

  <g
    inkscape:groupmode="layer"
    inkscape:label="06 — Código: chevron direito"
    id="layer-code-right">
    <path
      id="code-right"
      d="M 321.5,143.5 L 352,176 L 321.5,208.5"
      fill="none"
      stroke="#FFFFFF"
      stroke-width="32"
      stroke-linecap="round"
      stroke-linejoin="round"/>
  </g>
</svg>
