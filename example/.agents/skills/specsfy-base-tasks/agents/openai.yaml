interface:
  display_name: "Specsfy: Tarefas"
  short_description: "Cria tarefas com checklist progressivo"
  default_prompt: "Use $specsfy-base-tasks para preencher tarefas rastreáveis com checklist PREP/EXECUTE/VERIFY/EVIDENCE/IMPROVE em specs/specs/<NNNN>-<slug>/spec.md. Orquestre transições automáticas com anúncio, execução e retomada na mesma conversa."
